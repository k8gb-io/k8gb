---
apiVersion: k8gb.io/v1beta1
kind: Gslb
metadata:
  name: cluster-exposed-ips
  namespace: cluster-exposed-ips
spec:
  resourceRef:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    name: cluster-exposed-ips
  strategy:
    type: failover
    primaryGeoTag: eu
    dnsTtlSeconds: 5
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cluster-exposed-ips
  namespace: cluster-exposed-ips
spec:
  ingressClassName: nginx
  rules:
    - host: cluster-exposed-ips.cloud.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-podinfo
                port:
                  name: http
