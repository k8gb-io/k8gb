apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: legacy-migration-dnsendpoint-handoff
spec:
  namespace: legacy-migration-dnsendpoint-handoff
  steps:
  - name: namespace
    description: create namespace
    cluster: eu
    use:
      template: ../../step-templates/namespace.yaml
  - name: create legacy runtime object
    description: legacy runtime should create legacy-owned DNSEndpoint before migration is requested
    cluster: eu
    try:
    - apply:
        file: ./testdata/legacy-runtime.yaml
    - script:
        content: kubectl get gslb.k8gb.absa.oss legacy-dns-handoff -n "$NAMESPACE" -o jsonpath='{.metadata.uid}'
        outputs:
        - name: legacyUID
          value: ($stdout)
    - assert:
        resource:
          apiVersion: externaldns.k8s.io/v1alpha1
          kind: DNSEndpoint
          metadata:
            name: legacy-dns-handoff
            namespace: ($namespace)
            ownerReferences:
              (length([?apiVersion == 'k8gb.absa.oss/v1beta1' && kind == 'Gslb' && uid == $legacyUID])): 1
        timeout: 75s
  - name: request migration
    description: set migration request label and verify canonical object creation
    cluster: eu
    try:
    - script:
        env:
        - name: NAME
          value: legacy-dns-handoff
        content: |
          kubectl label gslb.k8gb.absa.oss "$NAME" -n "$NAMESPACE" k8gb.io/migration-requested=true --overwrite
    - assert:
        resource:
          apiVersion: k8gb.io/v1beta1
          kind: Gslb
          metadata:
            name: legacy-dns-handoff
            namespace: ($namespace)
          spec:
            resourceRef:
              apiVersion: networking.k8s.io/v1
              kind: Ingress
              name: legacy-dns-handoff
        timeout: 75s
    - assert:
        resource:
          apiVersion: k8gb.absa.oss/v1beta1
          kind: Gslb
          metadata:
            name: legacy-dns-handoff
            namespace: ($namespace)
            labels:
              k8gb.io/migrated-to-k8gb-io: "true"
        timeout: 45s
  - name: verify owner handoff and delete legacy object
    description: ownership moves to canonical and deleting legacy must keep canonical resources
    cluster: eu
    try:
    - script:
        content: kubectl get gslb.k8gb.absa.oss legacy-dns-handoff -n "$NAMESPACE" -o jsonpath='{.metadata.uid}'
        outputs:
        - name: legacyUID
          value: ($stdout)
    - script:
        content: kubectl get gslb.k8gb.io legacy-dns-handoff -n "$NAMESPACE" -o jsonpath='{.metadata.uid}'
        outputs:
        - name: canonicalUID
          value: ($stdout)
    - assert:
        resource:
          apiVersion: externaldns.k8s.io/v1alpha1
          kind: DNSEndpoint
          metadata:
            name: legacy-dns-handoff
            namespace: ($namespace)
            ownerReferences:
              (length([?apiVersion == 'k8gb.io/v1beta1' && kind == 'Gslb' && uid == $canonicalUID])): 1
              (length([?apiVersion == 'k8gb.absa.oss/v1beta1' && kind == 'Gslb' && uid == $legacyUID])): 0
        timeout: 75s
    - script:
        content: kubectl get dnsendpoint legacy-dns-handoff -n "$NAMESPACE" -o jsonpath='{.metadata.uid}'
        outputs:
        - name: endpointUID
          value: ($stdout)
    # Native deletion polls for absence within its own budget, without a child
    # kubectl wait outliving the global script timeout.
    - delete:
        ref:
          apiVersion: k8gb.absa.oss/v1beta1
          kind: Gslb
          name: legacy-dns-handoff
        timeout: 90s
    - assert:
        resource:
          apiVersion: k8gb.io/v1beta1
          kind: Gslb
          metadata:
            name: legacy-dns-handoff
            namespace: ($namespace)
            uid: ($canonicalUID)
    - assert:
        resource:
          apiVersion: externaldns.k8s.io/v1alpha1
          kind: DNSEndpoint
          metadata:
            name: legacy-dns-handoff
            namespace: ($namespace)
            uid: ($endpointUID)
            ownerReferences:
              (length([?apiVersion == 'k8gb.io/v1beta1' && kind == 'Gslb' && uid == $canonicalUID])): 1
              (length([?uid == $legacyUID])): 0
