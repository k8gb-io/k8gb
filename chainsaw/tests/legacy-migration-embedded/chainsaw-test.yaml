apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: legacy-migration-embedded
spec:
  namespace: legacy-migration-embedded
  steps:
  - name: namespace
    description: create namespace
    cluster: eu
    use:
      template: ../../step-templates/namespace.yaml
  - name: create legacy embedded
    description: let the legacy controller create the owned Ingress and DNSEndpoint
    cluster: eu
    try:
    - apply:
        file: ./testdata/legacy-embedded.yaml
  - name: assert legacy ownership
    cluster: eu
    bindings:
    - name: owner_api_version
      value: k8gb.absa.oss/v1beta1
    use:
      template: ../../step-templates/assert-blocking-gslb-owner.yaml
  - name: request migration
    description: detach the existing legacy Ingress and transfer the existing DNSEndpoint
    cluster: eu
    try:
    - script:
        content: |
          set -eu
          kubectl get ingress/legacy-migration-embedded dnsendpoint/legacy-migration-embedded -n "$NAMESPACE" -o json |
            jq '{ingress: (.items[] | select(.kind == "Ingress")), endpoint: (.items[] | select(.kind == "DNSEndpoint"))}'
        outputs:
        - name: before
          value: (json_parse($stdout))
    - script:
        content: |
          kubectl label gslb.k8gb.absa.oss legacy-migration-embedded -n "$NAMESPACE" k8gb.io/migration-requested=true
    - assert:
        resource:
          apiVersion: k8gb.io/v1beta1
          kind: Gslb
          metadata:
            name: legacy-migration-embedded
            namespace: ($namespace)
          spec:
            resourceRef:
              apiVersion: networking.k8s.io/v1
              kind: Ingress
              name: legacy-migration-embedded
        timeout: 75s
    - assert:
        resource:
          apiVersion: k8gb.absa.oss/v1beta1
          kind: Gslb
          metadata:
            name: legacy-migration-embedded
            namespace: ($namespace)
            labels:
              k8gb.io/migrated-to-k8gb-io: "true"
            finalizers:
            - k8gb.io/legacy-migration-protection
        timeout: 45s
    - script:
        content: |
          kubectl get gslb.k8gb.io legacy-migration-embedded -n "$NAMESPACE" -o json | \
            jq -e '(((.spec.ingress // {}) | keys | length) == 0) and .spec.resourceRef.name == "legacy-migration-embedded"' >/dev/null
    - assert:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: legacy-migration-embedded
            namespace: ($namespace)
            uid: ($before.ingress.metadata.uid)
            (length(ownerReferences || `[]`)): 0
        timeout: 45s
    - script:
        content: kubectl get gslb.k8gb.io legacy-migration-embedded -n "$NAMESPACE" -o json
        outputs:
        - name: canonical
          value: (json_parse($stdout))
    - assert:
        resource:
          apiVersion: externaldns.k8s.io/v1alpha1
          kind: DNSEndpoint
          metadata:
            name: legacy-migration-embedded
            namespace: ($namespace)
            uid: ($before.endpoint.metadata.uid)
            (length(ownerReferences)): 1
            ownerReferences:
            - apiVersion: k8gb.io/v1beta1
              kind: Gslb
              name: legacy-migration-embedded
              uid: ($canonical.metadata.uid)
              controller: true
              blockOwnerDeletion: true
        timeout: 45s
  - name: delete legacy object
    description: deleting legacy object must not delete ingress
    cluster: eu
    try:
    - delete:
        ref:
          apiVersion: k8gb.absa.oss/v1beta1
          kind: Gslb
          name: legacy-migration-embedded
    - wait:
        apiVersion: k8gb.absa.oss/v1beta1
        kind: Gslb
        name: legacy-migration-embedded
        for:
          deletion: {}
        timeout: 120s
    - assert:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: legacy-migration-embedded
            namespace: ($namespace)
        timeout: 30s
    - assert:
        resource:
          apiVersion: k8gb.io/v1beta1
          kind: Gslb
          metadata:
            name: legacy-migration-embedded
            namespace: ($namespace)
        timeout: 30s
