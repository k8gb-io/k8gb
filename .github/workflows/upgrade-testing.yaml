name: Upgrade Testing

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - '**.svg'
      - '**.drawio'
      - '.spelling'
  pull_request:
    branches:
      - master
    # The specific activity types are listed here to include "labeled" and "unlabeled"
    # (which are not included by default for the "pull_request" trigger).
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths-ignore:
      - '**.md'
      - '**.svg'
      - '**.drawio'
      - '.spelling'
permissions:
  contents: read

env:
  K3D_VERSION: v5.8.3

jobs:
  skip-check:
    runs-on: ubuntu-latest
    name: Skip the job?
    outputs:
          should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: block
        allowed-endpoints: >-
          api.github.com:443

    - id: skip_check
      uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
      with:
        skip_after_successful_duplicate: 'true'
        do_not_skip: '["workflow_dispatch", "schedule"]'

  upgrade-testing:
    runs-on: ubuntu-24.04
    needs: skip-check
    if: ${{ needs.skip-check.outputs.should_skip != 'true' && !contains(github.event.pull_request.labels.*.name, 'renovate') }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Dependency endpoints audited by the Chainsaw workload.
          # Include Go/tool downloads on cache misses and regional Kubernetes registry redirects.
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            go.dev:443
            dl.google.com:443
            proxy.golang.org:443
            storage.googleapis.com:443
            sum.golang.org:443
            auth.docker.io:443
            registry-1.docker.io:443
            production.cloudfront.docker.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            gcr.io:443
            k8s.gcr.io:443
            registry.k8s.io:443
            cdn.registry.k8s.io:443
            *-docker.pkg.dev:443
            registry.istio.io:443
            registry.k8gb.io:443
            get.helm.sh:443
            coredns.github.io:443
            kubernetes-sigs.github.io:443
            kubernetes.github.io:443
            istio-release.storage.googleapis.com:443
            stefanprodan.github.io:443
            k8gb.io:443
            www.k8gb.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Harden Runner initialization
        run: bash hack/verify-harden-runner.sh

      - name: Fetch upstream release tags on forks
        if: github.repository != 'k8gb-io/k8gb'
        run: git fetch https://github.com/k8gb-io/k8gb.git 'refs/tags/*:refs/tags/*'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
         go-version-file: ./go.mod

      - name: Setup helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Build artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --clean --skip=publish,validate,sbom,sign --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create edgeDNS k3s Cluster
        uses: AbsaOSS/k3d-action@4e8b3239042be1dc0aed6c5eb80c13b18200fc79
        with:
          cluster-name: "edgedns"
          args: -c k3d/edge-dns.yaml
          k3d-version: ${{ env.K3D_VERSION }}

      - name: Create 1st k3s Cluster
        uses: AbsaOSS/k3d-action@4e8b3239042be1dc0aed6c5eb80c13b18200fc79
        with:
          cluster-name: "test-gslb1"
          args: -c k3d/test-gslb1.yaml
          k3d-version: ${{ env.K3D_VERSION }}

      - name: Create 2nd k3s Cluster
        uses: AbsaOSS/k3d-action@4e8b3239042be1dc0aed6c5eb80c13b18200fc79
        with:
          cluster-name: "test-gslb2"
          args: -c k3d/test-gslb2.yaml
          k3d-version: ${{ env.K3D_VERSION }}

      - name: K8GB deploy stable version
        timeout-minutes: 20
        run: make deploy-stable-version list-running-pods

      - name: K8GB deploy test version
        timeout-minutes: 20
        run: make deploy-test-version list-running-pods

      - name: Run Terratest
        run: |
          mkdir -p ${{ github.workspace }}/tmp/terratest
          set -o pipefail
          make terratest | tee ${{ github.workspace }}/tmp/terratest/all.log
          echo "::endgroup::"

      - name: Verify Harden Runner enforcement after tests
        if: always()
        run: bash hack/verify-harden-runner.sh

      - name: Print debug info
        if: always()
        uses: ./.github/actions/print-terratest-debug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: terratest-logs
          path: ${{ github.workspace }}/tmp/terratest
