name: Helm Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g., v0.16.0)'
        required: true
        type: string
permissions:
  contents: read

env:
  K3D_VERSION: v5.8.3

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Audit: https://github.com/k8gb-io/k8gb/actions/runs/33623850616
          # Helm installer/dependencies, k3d image pulls, and chart installation smoke test.
          allowed-endpoints: |
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            auth.docker.io:443
            registry-1.docker.io:443
            production.cloudfront.docker.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            get.helm.sh:443
            coredns.github.io:443
            kubernetes-sigs.github.io:443
            k8gb.io:443
            www.k8gb.io:443
            registry.k8gb.io:443
            gcr.io:443
            k8s.gcr.io:443
            registry.k8s.io:443
            cdn.registry.k8s.io:443
            *-docker.pkg.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: dave-mcconnell/helm-gh-pages-microservices@8478af5f0fd712cc0fb59f2c99e0688f3f591287
        with:
          access-token: ${{ secrets.CR_TOKEN }}
          source-charts-folder: 'chart'
          destination-repo: k8gb-io/k8gb
          destination-branch: gh-pages

      - name: Create k3s cluster
        uses: AbsaOSS/k3d-action@4e8b3239042be1dc0aed6c5eb80c13b18200fc79
        with:
          cluster-name: "test-gslb1"
          args: -c k3d/test-gslb1.yaml
          k3d-version: ${{ env.K3D_VERSION }}

      - name: Smoke test helm installation
        run: |
          helm repo add k8gb https://k8gb.io/
          for i in $(seq 16)
          do
            helm repo update
            helm -n k8gb upgrade -i k8gb k8gb/k8gb --wait --create-namespace --version=$(make version) && exit 0
            _sec=$(echo "1.5^$i" | bc)
            echo "Waiting ${_sec} seconds.."
            sleep ${_sec}
          done
      - name: Invoke workflow for OLM (community-operators)
        if: always()
        continue-on-error: true
        uses: benc-uk/workflow-dispatch@7a027648b88c2413826b6ddd6c76114894dc5ec4
        with:
          workflow: olm_pr.yaml
          token: ${{ secrets.CR_TOKEN }}
          inputs: '{ "bundleVersion": "master" }' # during the release 'master' is what we want here
      - name: Invoke workflow for OLM (community-operators-prod)
        if: always()
        continue-on-error: true
        uses: benc-uk/workflow-dispatch@7a027648b88c2413826b6ddd6c76114894dc5ec4
        with:
          workflow: olm_pr.yaml
          token: ${{ secrets.CR_TOKEN }}
          inputs: |
            {
              "bundleVersion": "master",
              "downstreamRepo": "k8gb-io/community-operators-prod",
              "upstreamRepo": "redhat-openshift-ecosystem/community-operators-prod"
            }
