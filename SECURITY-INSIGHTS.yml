header:
  schema-version: 2.2.0
  last-updated: '2026-10-31'
  last-reviewed: '2026-10-31'
  url: https://raw.githubusercontent.com/k8gb-io/k8gb/master/SECURITY-INSIGHTS.yml

project:
  name: k8gb
  homepage: https://www.k8gb.io
  roadmap: https://github.com/orgs/k8gb-io/projects/2/views/2
  administrators:
    - name: Yury Tsarev
      affiliation: 0ttl
      social: https://github.com/ytsarev
      primary: true
    - name: Dinar Valeev
      affiliation: Absa Group Ltd
      social: https://github.com/k0da
      primary: false
    - name: Michal Kuritka
      affiliation: Absa Group Ltd
      social: https://github.com/kuritka
      primary: false
  repositories:
    - name: k8gb
      url: https://github.com/k8gb-io/k8gb
      comment: The k8gb controller, Helm chart, documentation and website.
    - name: coredns-crd-plugin
      url: https://github.com/k8gb-io/coredns-crd-plugin
      comment: |
        CoreDNS plugin that serves DNS records from DNSEndpoint resources. Its
        k8s_crd image is the CoreDNS deployed by the k8gb Helm chart.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    policy: https://github.com/k8gb-io/k8gb/blob/master/SECURITY.md
    contact:
      name: k8gb maintainers
      email: cncf-k8gb-maintainers@lists.cncf.io
      primary: true
    comment: |
      Report suspected vulnerabilities by email to the k8gb maintainers list,
      or privately through GitHub with the "Report a vulnerability" button on
      the repository's Security tab. SECURITY.md lists what to include in a
      report and how reports are handled. Confirmed vulnerabilities are
      coordinated in a draft GitHub security advisory.
  documentation:
    quickstart-guide: https://www.k8gb.io/local/
    detailed-guide: https://www.k8gb.io/tutorials/
    design: https://github.com/k8gb-io/k8gb/blob/master/ARCHITECTURE.md
    code-of-conduct: https://github.com/k8gb-io/k8gb/blob/master/CODE_OF_CONDUCT.md
    release-process: https://github.com/k8gb-io/k8gb/blob/master/CONTRIBUTING.md#release-process
    signature-verification: https://github.com/k8gb-io/k8gb/blob/master/CONTRIBUTING.md#verification-instructions

repository:
  url: https://github.com/k8gb-io/k8gb
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  bug-fixes-only: false
  core-team:
    - name: Yury Tsarev
      affiliation: 0ttl
      social: https://github.com/ytsarev
      primary: true
    - name: Donovan Muller
      affiliation: Capitec
      social: https://github.com/donovanmuller
      primary: false
    - name: Dinar Valeev
      affiliation: Absa Group Ltd
      social: https://github.com/k0da
      primary: false
    - name: Michal Kuritka
      affiliation: Absa Group Ltd
      social: https://github.com/kuritka
      primary: false
    - name: Jirka Kremser
      affiliation: Kedify
      social: https://github.com/jkremser
      primary: false
    - name: André Águas
      affiliation: Open Systems
      social: https://github.com/abaguas
      primary: false
    - name: Bradley Andersen
      affiliation: 0ttl
      social: https://github.com/elohmrow
      primary: false
  license:
    url: https://github.com/k8gb-io/k8gb/blob/master/LICENSE
    expression: Apache-2.0
  documentation:
    contributing-guide: https://github.com/k8gb-io/k8gb/blob/master/CONTRIBUTING.md
    review-policy: https://github.com/k8gb-io/k8gb/blob/master/CONTRIBUTING.md#contribution-flow
    dependency-management-policy: https://github.com/k8gb-io/k8gb/blob/master/DEPENDENCY.md
    governance: https://github.com/k8gb-io/k8gb/blob/master/GOVERNANCE.md
    security-policy: https://github.com/k8gb-io/k8gb/blob/master/SECURITY.md
  release:
    automated-pipeline: true
    distribution-points:
      - uri: https://github.com/k8gb-io/k8gb/releases
        comment: Release binaries, checksums, SBOMs and SLSA provenance.
      - uri: https://github.com/k8gb-io/k8gb/pkgs/container/k8gb
        comment: |
          Signed container images, published to ghcr.io/k8gb-io/k8gb. The Helm
          chart pulls them through registry.k8gb.io, which serves the same
          images.
      - uri: https://www.k8gb.io
        comment: Helm chart repository, added with "helm repo add k8gb https://www.k8gb.io"
      - uri: https://github.com/k8gb-io/k8gb/pkgs/container/charts%2Fk8gb
        comment: Signed Helm chart in OCI format at oci://ghcr.io/k8gb-io/charts/k8gb.
    changelog: https://github.com/k8gb-io/k8gb/blob/master/CHANGELOG.md
    attestations:
      - name: SLSA provenance
        location: https://github.com/k8gb-io/k8gb/releases/latest
        predicate-uri: https://slsa.dev/provenance/v0.2
        comment: |
          Attached to each release as multiple.intoto.jsonl, generated by
          slsa-framework/slsa-github-generator. See the verification
          instructions in CONTRIBUTING.md.
      - name: SBOM
        location: https://github.com/k8gb-io/k8gb/releases/latest
        predicate-uri: https://spdx.github.io/spdx-spec/v2.2.2/
        comment: |
          SPDX SBOM for each release archive, generated by Syft and attached
          to the release as k8gb_<version>_<os>_<arch>.tar.gz.sbom.json with
          a cosign signature.
  security:
    assessments:
      self:
        name: k8gb security self-assessment
        evidence: https://github.com/k8gb-io/k8gb/blob/master/self-assessment.md
        date: '2026-10-31'
        comment: |
          Self-assessment following the OpenSSF security self-assessment
          template, reviewed by the maintainers in k8gb#2574. An earlier
          version, based on the CNCF TAG Security and Compliance template,
          was added to the CNCF TOC repository in cncf/toc#1977.
    tools:
      - name: CodeQL
        type: SAST
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          ci:
            name: CodeQL workflow runs
            location: https://github.com/k8gb-io/k8gb/actions/workflows/codeql-analysis.yml
            predicate-uri: https://docs.oasis-open.org/sarif/sarif/v2.1.0/sarif-v2.1.0.html
        comment: |
          Runs on every pull request, on pushes to master, and weekly. Reports
          the Go analysis job check and separate security results through
          GitHub code scanning.
      - name: OpenSSF Scorecard
        type: other
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          adhoc:
            name: Published Scorecard results
            location: https://scorecard.dev/viewer/?uri=github.com/k8gb-io/k8gb
            predicate-uri: https://github.com/ossf/scorecard
        comment: Runs on pushes to master, on branch protection changes, and weekly.
      - name: OSPS Baseline Scanner
        type: other
        rulesets:
          - osps-baseline
        integration:
          adhoc: true
          ci: false
          release: false
        results:
          adhoc:
            name: OSPS Baseline evaluation
            location: https://grc.store/targets/k8gb-io/k8gb
            predicate-uri: https://github.com/revanite-io/pvtr-publish-results
        comment: |
          Scans the repository against the OSPS Baseline at Maturity Level 2
          weekly and on demand, and publishes the signed result to grc.store
          (see .github/workflows/publish-to-grc-store.yml).
          Manual-review evidence for privileged workflows, external interfaces,
          self-assessment coverage, and advisory publication is recorded at
          https://github.com/k8gb-io/k8gb/blob/master/SECURITY.md#osps-baseline-review-evidence.
