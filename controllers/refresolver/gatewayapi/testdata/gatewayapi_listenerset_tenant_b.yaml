apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: tenant-b
  namespace: tenant
spec:
  parentRef:
    name: shared
    namespace: gateway-infra
  listeners:
  - name: api-443
    hostname: api.example.com
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - name: tls-api
