deployment:
  replicas: 1

# Use hostNetwork so the controller binds to ports 80/443 on the k3d agent node,
# preserving the same host port exposure used by the retired ingress-nginx DaemonSet.
hostNetwork: true

# Disable the LoadBalancer service — address publication is handled via hostNetwork.
service:
  enabled: false

# Disable the dashboard to keep the local playground minimal.
ingressRoute:
  dashboard:
    enabled: false

# Expose HTTP on port 80 and HTTPS on port 443.
ports:
  web:
    port: 8000
    hostPort: 80
  websecure:
    port: 8443
    hostPort: 443
  metrics:
    expose:
      default: false

providers:
  kubernetesIngress:
    publishedService:
      enabled: false

# Register an IngressClass named "traefik" as the cluster default.
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
