apiVersion: v1
kind: Namespace
metadata:
  name: dynamo-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamo-demo
  namespace: dynamo-demo
data:
  HF_HUB_OFFLINE: "1"
  DYN_DISCOVERY_BACKEND: file
  DYN_FILE_KV: /var/run/dynamo-discovery
  DYN_REQUEST_PLANE: tcp
  DYN_EVENT_PLANE: zmq
  DYN_NAMESPACE: k8gb-demo
  DYN_RUNTIME_NUM_WORKER_THREADS: "2"
  DYN_RUNTIME_MAX_BLOCKING_THREADS: "8"
  DYN_COMPUTE_THREADS: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-demo
  namespace: dynamo-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dynamo-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynamo-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      - name: tokenizer
        image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.6.0
        imagePullPolicy: IfNotPresent
        command: [hf, download]
        args:
        - Qwen/Qwen3-0.6B
        - config.json
        - generation_config.json
        - tokenizer.json
        - tokenizer_config.json
        - --revision
        - c1899de289a04d12100db370d81485cdf75e47ca
        - --local-dir
        - /opt/model
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        volumeMounts:
        - name: model
          mountPath: /opt/model
      containers:
      - name: frontend
        image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.6.0
        imagePullPolicy: IfNotPresent
        command: [python3, -m, dynamo.frontend]
        args: [--http-port, "8000", --router-mode, kv]
        envFrom:
        - configMapRef:
            name: dynamo-demo
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /v1/models/Qwen/Qwen3-0.6B/ready
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /v1/models/Qwen/Qwen3-0.6B/ready
            port: http
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /live
            port: http
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        volumeMounts:
        - name: discovery
          mountPath: /var/run/dynamo-discovery
        - name: model
          mountPath: /opt/model
          readOnly: true
      - name: workers
        image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.6.0
        imagePullPolicy: IfNotPresent
        command: [python3, -m, dynamo.mocker]
        args:
        - --model-path
        - /opt/model
        - --model-name
        - Qwen/Qwen3-0.6B
        - --num-workers
        - "2"
        - --block-size
        - "16"
        - --speedup-ratio
        - "10"
        envFrom:
        - configMapRef:
            name: dynamo-demo
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1536Mi
        volumeMounts:
        - name: discovery
          mountPath: /var/run/dynamo-discovery
        - name: model
          mountPath: /opt/model
          readOnly: true
      volumes:
      - name: discovery
        emptyDir: {}
      - name: model
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dynamo-demo
  namespace: dynamo-demo
spec:
  selector:
    app.kubernetes.io/name: dynamo-demo
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dynamo-demo
  namespace: dynamo-demo
spec:
  ingressClassName: nginx
  rules:
  - host: dynamo.cloud.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dynamo-demo
            port:
              name: http
---
apiVersion: k8gb.io/v1beta1
kind: Gslb
metadata:
  name: dynamo-demo
  namespace: dynamo-demo
spec:
  resourceRef:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    name: dynamo-demo
  strategy:
    type: failover
    primaryGeoTag: eu
